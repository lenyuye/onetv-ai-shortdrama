name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端 typecheck + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13（node:sqlite 内置模块）
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: 单元测试（vitest）
        run: pnpm test

  backend:
    name: Rust 测试（核心 crates）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 核心 crates 纯 Rust 测试无需 GTK/WebKit 系统库；
      # onetv-desktop（Tauri 桌面壳）的构建验证由 release.yml 三平台构建覆盖
      # golden pipeline E2E 的 Mock 生图/合成走本机 ffmpeg（lavfi gradients），需预装
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: cargo test（核心 crates，含 golden pipeline E2E）
        run: cargo test -p onetv-core -p onetv-project -p onetv-media -p onetv-security
