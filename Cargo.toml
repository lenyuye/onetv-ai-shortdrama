[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/media",
    "crates/security",
    "crates/project",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.26.28"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/onetv-labs/onetv"

[workspace.dependencies]
onetv-core = { path = "crates/core" }
onetv-media = { path = "crates/media" }
onetv-security = { path = "crates/security" }
onetv-project = { path = "crates/project" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
base64 = "0.22"
regex = "1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "tokio1", "tokio1-rustls"] }

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true

[profile.dev]
opt-level = 0
debug = 1
